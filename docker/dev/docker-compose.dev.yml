version: "3.9"

services:
  mysql-dev:
    image: mysql:8.0
    container_name: mooncake-mysql-dev
    env_file:
      - .env.dev
    environment:
      TZ: Etc/UTC
    ports:
      - "3306:3306"
    volumes:
      - mooncake_mysql_dev_data:/var/lib/mysql
      - ../mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: mooncake-adminer-dev
    ports:
      - "8080:8080"
    environment:
      TZ: Etc/UTC
    depends_on:
      mysql-dev:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mooncake_mysql_dev_data:
