name: mooncake-stg

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: mooncake-api:stg
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Server__Port: "8089"
      Server__TimeZone: Etc/UTC
      TZ: Etc/UTC
      GoogleOAuth__RedirectUri: "${STG_PUBLIC_ORIGIN:?Set STG_PUBLIC_ORIGIN in docker/stg/.env}/auth/google/callback"
      Cors__AllowedOrigins__0: "${STG_PUBLIC_ORIGIN:?Set STG_PUBLIC_ORIGIN in docker/stg/.env}"
    volumes:
      - type: bind
        source: ../../src/Mooncake.EcommercePlatform.WebApi/appsettings.json
        target: /app/appsettings.json
        read_only: true
    ports:
      - "${STG_BIND_ADDRESS:-127.0.0.1}:8089:8089"
    restart: unless-stopped

  web:
    build:
      context: ../../../mooncake-fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_API_VERSION: v1
        VITE_APP_ENV: staging
        VITE_ENABLE_MOCK_FALLBACK: "false"
        VITE_ENABLE_DEBUG_LOGS: "false"
    image: mooncake-fe:stg
    depends_on:
      - api
    ports:
      - "${STG_BIND_ADDRESS:-127.0.0.1}:5173:5173"
    restart: unless-stopped
