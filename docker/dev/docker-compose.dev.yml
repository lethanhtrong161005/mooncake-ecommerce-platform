version: "3.9"

# NOTE: MySQL has been removed. Database is now managed by Supabase (PostgreSQL).
# This compose file only runs supporting local services.

services:
  clamav:
    image: clamav/clamav:stable
    container_name: mooncake-clamav-dev
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    environment:
      TZ: Etc/UTC
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: mooncake-adminer-dev
    ports:
      - "8080:8080"
    environment:
      TZ: Etc/UTC
      ADMINER_DEFAULT_SERVER: db.supabase.co
    restart: unless-stopped

volumes:
  clamav-data:
