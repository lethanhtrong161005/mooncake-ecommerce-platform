version: "3.9"

# NOTE: MySQL has been removed. Database is now managed by Supabase (PostgreSQL).
# This compose file only runs supporting local services.

services:
  adminer:
    image: adminer:latest
    container_name: mooncake-adminer-dev
    ports:
      - "8080:8080"
    environment:
      TZ: Etc/UTC
      ADMINER_DEFAULT_SERVER: db.supabase.co
    restart: unless-stopped
