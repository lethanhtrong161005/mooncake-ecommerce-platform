version: "3.9"

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: mooncake-postgres-dev
    env_file:
      - .env.dev
    environment:
      TZ: Etc/UTC
    ports:
      - "5432:5432"
    volumes:
      - mooncake_pg_dev_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mooncake-pgadmin-dev
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mooncake.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      TZ: Etc/UTC
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mooncake_pg_dev_data:
