version: "3.9"

services:
  postgres-stg:
    image: postgres:16-alpine
    container_name: mooncake-postgres-stg
    env_file:
      - .env.stg
    environment:
      TZ: Etc/UTC
    volumes:
      - mooncake_pg_stg_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mooncake_pg_stg_data:
